<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Lime Clicker</title>
    <link rel="shortcut icon" href="TemplateData/favicon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">

    <style>
      /* Tämä on oletuksena piilossa */
      #orientation-warning {
        display: none;
      }

      /* Tunnistetaan, jos ruutu on kapeampi kuin se on leveä (Portrait / Pysty) */
      @media only screen and (orientation: portrait) {
        #orientation-warning {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: #1a1a1a; /* Tumma tausta */
          z-index: 9999; /* Varmistetaan että on kaiken päällä */
          color: white;
          font-family: Arial, sans-serif;
          text-align: center;
        }

        /* Piilotetaan Unity-sisältö taustalta, jotta se ei vilku */
        #unity-container {
          display: none !important;
        }

        /* Puhelin-ikoni */
        .phone-icon {
          width: 60px;
          height: 100px;
          border: 4px solid white;
          border-radius: 10px;
          margin-bottom: 20px;
          animation: rotate-phone 2s infinite ease-in-out;
        }
      }

      /* Animaatio puhelimen kääntämiselle */
      @keyframes rotate-phone {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(-90deg); }
        100% { transform: rotate(-90deg); }
      }
    </style>
    </head>
  <body>
    
    <div id="orientation-warning">
      <div class="phone-icon"></div>
      <h2>Please Rotate Your Device</h2>
      <p>This game requires Landscape mode.</p>
    </div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/LimeClicker 7.1.loader.js";
      var config = {
        dataUrl: buildUrl + "/LimeClicker 7.1.data",
        frameworkUrl: buildUrl + "/LimeClicker 7.1.framework.js",
        codeUrl: buildUrl + "/LimeClicker 7.1.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Lime Entertainment",
        productName: "Lime Clicker",
        productVersion: "7",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      canvas.style.background = "url('" + buildUrl + "/LimeClicker 7.1.jpg') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
